[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lv-sensor-optimizer"
version = "1.0.0"
description = "Multi-objective multisensor smoke detector layout optimizer for buildings using PSO, GA, and SA"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "LV System Design Engineering Team" }
]
keywords = [
    "fire-alarm-system",
    "smoke-detector-optimization",
    "particle-swarm-optimization",
    "genetic-algorithm",
    "simulated-annealing",
    "is-2189",
    "nfpa-72",
    "building-services",
    "low-voltage-systems"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "pymupdf>=1.23.0",
    "openpyxl>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[project.scripts]
lv-opt = "lv_sensor_optimizer.cli:main"
